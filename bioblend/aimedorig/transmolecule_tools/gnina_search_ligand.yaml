id: gnina_search_ligand
name: Gnina Search Ligand
version: 1.0
description: null
inputs:
- id: receptor
  name: Receptor
  type: data
  multiple: false
  help: PDB file of the receptor
  optional: false
- id: workers
  name: Workers
  type: text
  multiple: false
  help: null
  optional: true
  value: 8
- id: max_count
  type: integer
  name: Max ligand count
  optional: true
  value: -1
  min: -1
  max: 99999
  help: Maximum number of ligands to dock. -1 for all, small number for testing
input_examples:
  receptor:
    id: null
    src: hda
  workers: '8'
  max_count: '3'
outputs:
- id: null
  hid: null
  name: Gnina Search Ligand Res(csv)
  file_ext: csv
  example: output_id = res['outputs'][0]['id']
output_collections:
- id: null
  hid: null
  name: Gnina Search Ligand Res(sdf)
  example: output_id = res['output_collections'][0]['id']
